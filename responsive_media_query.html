<!DOCTYPE html>
<html>
<head>
  <!-- Inspired by: https://www.w3schools.com/html/tryit.asp?filename=tryhtml_responsive_media_query -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
		box-sizing: border-box;
		}

		.content {
			padding: 20px;
			float: left;	
		}

		#left {
		background-color: #2196F3;
		width: 20%; /* The width is 20%, by default */
		}

		#main {
		background-color: #f1f1f1;
		width: 60%; /* The width is 60%, by default */
		}

		#right {
		background-color: #04AA6D;
		width: 20%; /* The width is 20%, by default */
		}

		/* Use a media query to add a break point at 800px: */
		@media screen and (max-width: 800px) {
		.left, .main, .right {
			width: 100%; /* The width is 100%, when the viewport is 800px or smaller */
		}
		}
	</style>
</head>

<body>

	<header>
		<h2>Media Queries</h2>
		<p>Resize the browser window.</p>
	</header>

	<main>
		<p>Make sure you reach the breakpoint at 800px when resizing this frame.</p>
	
		<section id="left" class="content">
		  <p>Left Menu</p>
		</section>
		
		<section id="main" class="content">
		  <p>Main Content</p>
		</section>
		
		<section id="right" class="content">
		  <p>Right Content</p>
		</section>
		
	</main>

	<footer>
		<p>An example showing a responsive design with sections.</p>
	</footer>
	
</body>
</html>
