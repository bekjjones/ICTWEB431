<!DOCTYPE html>
<html>
<head>
  <!-- Inspired by: https://www.w3schools.com/html/tryit.asp?filename=tryhtml_responsive_media_query -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body>

	<header>
		<h2>Media Queries</h2>
		<p>Resize the browser window.</p>
	</header>

	<main>
		<p>Make sure you reach the breakpoint at 800px when resizing this frame.</p>
	
		<section id="left" class="content">
		  <p>Left Menu</p>
		</section>
		
		<section id="main" class="content">
		  <p>Main Content</p>
		</section>
		
		<section id="right" class="content">
		  <p>Right Content</p>
		</section>
		
	</main>

	<footer>
		<p>An example showing a responsive design with sections.</p>
	</footer>
	
</body>
</html>
